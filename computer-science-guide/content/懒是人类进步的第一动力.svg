<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1040" viewBox="0 0 1740 1040" role="img" aria-labelledby="title desc">
  <title id="title">懒是人类进步的第一动力。</title>
  <desc id="desc">人不愿把时间浪费在重复劳动上，于是发明算盘、机械装置和计算机，把重复工作交给工具。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#e9f1fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#17355d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#3478c5"/>
    </marker>
    <style>
      .title { fill: #102a43; font: 700 50px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .subtitle { fill: #627d98; font: 400 23px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .eyebrow { fill: #4776aa; font: 700 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 2px; }
      .section { fill: #102a43; font: 700 27px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label { fill: #102a43; font: 700 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .body { fill: #486581; font: 400 19px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .formula { fill: #1f5e9f; font: 700 20px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .formula-small { fill: #1f5e9f; font: 700 16px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .eyebrow-small { fill: #4776aa; font: 700 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1740" height="1040" fill="url(#background)"/>
  <path d="M0 902 C310 824 575 980 900 902 S1450 830 1740 900 V1040 H0 Z" fill="#dfeaf7"/>
  <circle cx="1587" cy="108" r="141" fill="#d9e9f8"/>
  <circle cx="1680" cy="61" r="52" fill="#c4dbf2"/>

  <text x="90" y="88" class="eyebrow">COMPUTER SCIENCE GUIDE / A HUMAN MOTIVE</text>
  <text x="90" y="157" class="title">懒是人类进步的第一动力。</text>
  <text x="90" y="201" class="subtitle">不是不想做事，而是不想把时间浪费在可以自动重复的事情上。</text>

  <g filter="url(#shadow)">
    <rect x="90" y="272" width="430" height="570" rx="30" fill="#ffffff"/>
    <rect x="574" y="272" width="570" height="570" rx="30" fill="#ffffff"/>
    <rect x="1198" y="272" width="452" height="570" rx="30" fill="#ffffff"/>
  </g>

  <text x="138" y="330" class="eyebrow">THE WISH</text>
  <text x="138" y="382" class="section">我只想算一次</text>
  <text x="138" y="417" class="body">剩下的九千九百九十九次，</text>
  <text x="138" y="447" class="body">能不能让工具代劳？</text>

  <!-- A person resting while a stack of tasks waits nearby -->
  <g stroke="#3478c5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M145 688 H427"/>
    <path d="M165 688 L151 758 M407 688 L421 758"/>
    <path d="M184 615 C203 577 274 577 298 615 L324 671 H184 Z" fill="#e9f3ff"/>
    <circle cx="238" cy="539" r="38" fill="#e9f3ff"/>
    <path d="M274 618 C312 603 344 618 366 651" fill="none"/>
    <path d="M345 650 L401 650 L401 698 L345 698 Z" fill="#fff9ec" stroke="#d99722"/>
  </g>
  <path d="M214 530 C226 512 251 506 268 519" fill="none" stroke="#3478c5" stroke-width="5" stroke-linecap="round"/>
  <text x="373" y="678" text-anchor="middle" class="formula-small">重复题</text>
  <g fill="#d99722">
    <circle cx="362" cy="498" r="5"/>
    <circle cx="392" cy="477" r="7"/>
    <circle cx="421" cy="508" r="4"/>
  </g>
  <text x="138" y="788" class="label">懒，是对重复劳动的拒绝</text>

  <text x="622" y="330" class="eyebrow">TOOLS EVOLVE</text>
  <text x="622" y="382" class="section">把“懒”变成工具</text>
  <text x="622" y="417" class="body">每一次工具升级，都是少做一点重复动作</text>

  <!-- Evolution path -->
  <path d="M680 642 H1054" fill="none" stroke="#9fc3e5" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <circle cx="704" cy="642" r="17" fill="#3478c5"/>
  <circle cx="858" cy="642" r="17" fill="#3478c5"/>
  <circle cx="1012" cy="642" r="17" fill="#3478c5"/>

  <g transform="translate(635 472)">
    <rect width="138" height="125" rx="20" fill="#edf5fd" stroke="#b7d2eb" stroke-width="2"/>
    <text x="69" y="32" text-anchor="middle" class="eyebrow">TOOL 1</text>
    <!-- abacus -->
    <path d="M25 55 H113 M25 79 H113 M25 103 H113 M32 43 V113 M106 43 V113" fill="none" stroke="#3478c5" stroke-width="4" stroke-linecap="round"/>
    <circle cx="53" cy="55" r="8" fill="#d99722"/><circle cx="79" cy="55" r="8" fill="#d99722"/>
    <circle cx="67" cy="79" r="8" fill="#d99722"/><circle cx="93" cy="103" r="8" fill="#d99722"/>
    <text x="69" y="151" text-anchor="middle" class="label">算盘</text>
  </g>

  <g transform="translate(789 472)">
    <rect width="138" height="125" rx="20" fill="#fff9ec" stroke="#e9bc64" stroke-width="2"/>
    <text x="69" y="32" text-anchor="middle" fill="#a3670c" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" letter-spacing="2">TOOL 2</text>
    <!-- gears -->
    <circle cx="57" cy="73" r="25" fill="none" stroke="#d99722" stroke-width="8"/>
    <circle cx="91" cy="91" r="17" fill="none" stroke="#d99722" stroke-width="7"/>
    <circle cx="57" cy="73" r="6" fill="#d99722"/><circle cx="91" cy="91" r="5" fill="#d99722"/>
    <path d="M57 40 V32 M57 106 V114 M24 73 H16 M90 73 H98" stroke="#d99722" stroke-width="6" stroke-linecap="round"/>
    <text x="69" y="151" text-anchor="middle" class="label">齿轮</text>
  </g>

  <g transform="translate(943 472)">
    <rect width="138" height="125" rx="20" fill="#edf5fd" stroke="#b7d2eb" stroke-width="2"/>
    <text x="69" y="32" text-anchor="middle" class="eyebrow">TOOL 3</text>
    <!-- circuit -->
    <rect x="33" y="48" width="72" height="58" rx="12" fill="#ffffff" stroke="#3478c5" stroke-width="4"/>
    <path d="M25 64 H33 M25 90 H33 M105 64 H113 M105 90 H113" stroke="#3478c5" stroke-width="4" stroke-linecap="round"/>
    <text x="69" y="83" text-anchor="middle" class="formula-small">RULE</text>
    <text x="69" y="151" text-anchor="middle" class="label">计算机</text>
  </g>
  <text x="622" y="748" class="label">人类越来越少亲手重复，</text>
  <text x="622" y="778" class="label">工具越来越会自动执行。</text>
  <text x="622" y="809" class="body">懒没有消失，它变成了设计工具的理由。</text>

  <text x="1246" y="330" class="eyebrow">THE PRINCIPLE</text>
  <text x="1246" y="382" class="section">真正的进步</text>
  <text x="1246" y="417" class="body">不是把人变得更忙，</text>
  <text x="1246" y="447" class="body">而是让机器接手重复。</text>

  <g transform="translate(1260 493)">
    <rect width="328" height="218" rx="24" fill="#f3f8ff" stroke="#9fc3e5" stroke-width="3"/>
    <text x="164" y="61" text-anchor="middle" class="eyebrow-small">FROM HUMAN TO MACHINE</text>
    <text x="164" y="111" text-anchor="middle" class="label">提出规则</text>
    <path d="M164 128 V158" fill="none" stroke="#3478c5" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="164" y="196" text-anchor="middle" fill="#1f5e9f" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">交给工具执行</text>
  </g>

  <g transform="translate(90 910)">
    <rect width="1560" height="82" rx="22" fill="#ffffff" opacity="0.92"/>
    <circle cx="42" cy="41" r="12" fill="#d99722"/>
    <text x="72" y="49" class="label">所以，算盘、机械计算机和电子计算机，都是人类“懒”出来的好工具。</text>
    <text x="1454" y="49" text-anchor="end" fill="#3478c5" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="700">进步</text>
  </g>
</svg>
