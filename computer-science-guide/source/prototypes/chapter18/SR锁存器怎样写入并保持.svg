<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">一位记忆：写入信号撤去以后，状态为什么还在</title><desc id="desc">S 和 R 都为 0，交叉耦合的两个 NOR 门让锁存器保持 Q 等于 0。</desc>
  <defs><style>.cn{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.mono{font-family:"SFMono-Regular",Menlo,Consolas,monospace}.navy{fill:#0B2855}.muted{fill:#65748D}.title{font-size:62px;font-weight:750}.subtitle{font-size:29px}.section{font-size:29px;font-weight:700}.wire{fill:none;stroke-linecap:round;stroke-linejoin:round}</style><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A8B7CA"/></marker><marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#F85C0C"/></marker></defs>
  <rect width="1672" height="941" fill="#FFFEFF"/><text x="52" y="76" class="cn navy title">一位记忆：写入信号撤去以后，状态为什么还在？</text><text x="54" y="126" class="cn navy subtitle">S、R 只负责短暂写入；两个 NOR 门之间的反馈负责把结果留下来。</text>
  <text x="64" y="204" class="cn navy section">写入信号</text><text x="500" y="204" class="cn navy section">两个门互相照看</text><text x="998" y="204" class="cn navy section">保存下来的状态</text>
  <rect id="r-chip" x="65" y="275" width="215" height="84" rx="18" fill="#F5F8FE" stroke="#C4D4E9" stroke-width="2"/><text x="91" y="309" class="cn navy" font-size="21" font-weight="700">写 0 请求</text><text x="91" y="342" class="mono navy" font-size="27" font-weight="750">R =</text><text id="r-value" x="169" y="342" class="mono" fill="#65748D" font-size="30" font-weight="750">0</text>
  <rect id="s-chip" x="65" y="503" width="215" height="84" rx="18" fill="#F5F8FE" stroke="#C4D4E9" stroke-width="2"/><text x="91" y="537" class="cn navy" font-size="21" font-weight="700">写 1 请求</text><text x="91" y="570" class="mono navy" font-size="27" font-weight="750">S =</text><text id="s-value" x="169" y="570" class="mono" fill="#65748D" font-size="30" font-weight="750">0</text>
  <path id="r-wire" d="M280 317H560" class="wire" stroke="#A8B7CA" stroke-width="3" marker-end="url(#arrow-muted)"/><path id="s-wire" d="M280 545H560" class="wire" stroke="#A8B7CA" stroke-width="3" marker-end="url(#arrow-muted)"/>
  <path d="M560 252Q645 252 718 332Q645 412 560 412Q611 332 560 252Z" fill="#EFF7FE" stroke="#0B2855" stroke-width="3.5"/><circle cx="738" cy="332" r="18" fill="#FFFFFF" stroke="#0B2855" stroke-width="3.5"/><text x="619" y="342" class="mono navy" font-size="25" font-weight="750">NOR</text>
  <path d="M560 448Q645 448 718 528Q645 608 560 608Q611 528 560 448Z" fill="#EDF9F1" stroke="#0B2855" stroke-width="3.5"/><circle cx="738" cy="528" r="18" fill="#FFFFFF" stroke="#0B2855" stroke-width="3.5"/><text x="619" y="538" class="mono navy" font-size="25" font-weight="750">NOR</text>
  <path id="q-wire" d="M756 332H994" class="wire" stroke="#A8B7CA" stroke-width="3" marker-end="url(#arrow-muted)"/><path id="qbar-wire" d="M756 528H994" class="wire" stroke="#F85C0C" stroke-width="5" marker-end="url(#arrow-hot)"/>
  <rect id="q-chip" x="997" y="280" width="172" height="104" rx="20" fill="#F5F8FE" stroke="#C4D4E9" stroke-width="2"/><text x="1024" y="322" class="mono navy" font-size="24" font-weight="700">Q =</text><text id="q-value" x="1106" y="323" class="mono" fill="#65748D" font-size="33" font-weight="750">0</text><text x="1024" y="357" class="cn muted" font-size="20">记住的比特</text>
  <rect id="qbar-chip" x="997" y="476" width="172" height="104" rx="20" fill="#FEF2E5" stroke="#F85C0C" stroke-width="3"/><text x="1017" y="518" class="mono navy" font-size="24" font-weight="700">Q̅ =</text><text id="qbar-value" x="1106" y="519" class="mono" fill="#C84500" font-size="33" font-weight="750">1</text><text x="1024" y="553" class="cn muted" font-size="20">Q 的相反值</text>
  <path id="feedback-q" d="M850 332V420H470V493H560" class="wire" stroke="#A8B7CA" stroke-width="3" marker-end="url(#arrow-muted)"/><path id="feedback-qbar" d="M900 528V434H500V369H560" class="wire" stroke="#F85C0C" stroke-width="5" marker-end="url(#arrow-hot)"/><circle id="junction-q" cx="850" cy="332" r="6" fill="#A8B7CA"/><circle id="junction-qbar" cx="900" cy="528" r="6" fill="#F85C0C"/>
  <circle id="phase-badge" cx="1264" cy="251" r="36" fill="#1568E0"/><text id="phase-number" x="1264" y="260" class="cn" fill="#FFFFFF" font-size="24" font-weight="750" text-anchor="middle">1</text><text id="state-title" x="1320" y="262" class="cn navy" font-size="30" font-weight="750">初始：保持 0</text><text id="state-line-1" x="1264" y="338" class="cn navy" font-size="25">S = 0，R = 0</text><text id="state-line-2" x="1264" y="383" class="cn navy" font-size="25">Q = 0，Q̅ = 1</text><line x1="1264" y1="423" x2="1589" y2="423" stroke="#D9E2F0" stroke-width="2"/><text x="1264" y="470" class="cn" fill="#1568E0" font-size="22" font-weight="700">此刻是谁在起作用？</text><text id="focus-line-1" x="1264" y="516" class="cn" fill="#C84500" font-size="25" font-weight="700">Q̅ = 1 的反馈路径</text><text id="focus-line-2" x="1264" y="558" class="cn muted" font-size="23">写入信号已经撤去</text>
  <line x1="154" y1="700" x2="1518" y2="700" stroke="#D9E2F0" stroke-width="3"/><g class="cn" text-anchor="middle"><circle id="timeline-circle-0" cx="154" cy="700" r="25" fill="#1568E0"/><text id="timeline-number-0" x="154" y="708" fill="#FFFFFF" font-size="21" font-weight="750">1</text><text id="timeline-label-0" x="154" y="750" fill="#155ECF" font-size="20" font-weight="700">初始 0</text><circle id="timeline-circle-1" cx="495" cy="700" r="25" fill="#FFFFFF" stroke="#C4D4E9" stroke-width="2"/><text id="timeline-number-1" x="495" y="708" fill="#65748D" font-size="21" font-weight="750">2</text><text id="timeline-label-1" x="495" y="750" fill="#65748D" font-size="20">写入 1</text><circle id="timeline-circle-2" cx="836" cy="700" r="25" fill="#FFFFFF" stroke="#C4D4E9" stroke-width="2"/><text id="timeline-number-2" x="836" y="708" fill="#65748D" font-size="21" font-weight="750">3</text><text id="timeline-label-2" x="836" y="750" fill="#65748D" font-size="20">保持 1</text><circle id="timeline-circle-3" cx="1177" cy="700" r="25" fill="#FFFFFF" stroke="#C4D4E9" stroke-width="2"/><text id="timeline-number-3" x="1177" y="708" fill="#65748D" font-size="21" font-weight="750">4</text><text id="timeline-label-3" x="1177" y="750" fill="#65748D" font-size="20">写入 0</text><circle id="timeline-circle-4" cx="1518" cy="700" r="25" fill="#FFFFFF" stroke="#C4D4E9" stroke-width="2"/><text id="timeline-number-4" x="1518" y="708" fill="#65748D" font-size="21" font-weight="750">5</text><text id="timeline-label-4" x="1518" y="750" fill="#65748D" font-size="20">保持 0</text></g>
  <rect x="48" y="808" width="1576" height="98" rx="18" fill="#FFFFFF" stroke="#6C9FE8" stroke-width="2.2" stroke-dasharray="10 8"/><g transform="translate(83 826)" fill="none" stroke="#1568E0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M28 4C13 4 4 15 4 28C4 38 10 44 16 50C20 54 20 58 20 61H36C36 58 36 54 40 50C46 44 52 38 52 28C52 15 43 4 28 4Z"/><path d="M20 66H36M22 72H34M25 78H31"/><path d="M28-2V-10M5 6L-1 0M51 6L57 0M-1 28H-10M57 28H66"/><path d="M23 47V34L28 39L33 34V47"/></g><line x1="167" y1="828" x2="167" y2="887" stroke="#6C9FE8" stroke-width="2"/><text x="198" y="870" class="cn" fill="#1568E0" font-size="29" font-weight="700">关键点：</text><text x="330" y="870" class="cn navy" font-size="27">写入信号只需短暂改变状态；撤去以后，交叉反馈会把刚写入的 Q 继续保持下去。</text>
</svg>
