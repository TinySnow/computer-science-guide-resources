<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1040" viewBox="0 0 1740 1040" role="img" aria-labelledby="title desc">
  <title id="title">懒是人类进步的第一动力。</title>
  <desc id="desc">人不愿在重复劳动上消耗时间，于是不断发明更好的工具，把重复工作交给工具和计算机。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#e9f1fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#17355d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#3478c5"/>
    </marker>
    <style>
      .title { fill: #102a43; font: 700 50px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .subtitle { fill: #627d98; font: 400 23px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .eyebrow { fill: #4776aa; font: 700 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 2px; }
      .heading { fill: #102a43; font: 700 30px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label { fill: #102a43; font: 700 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .body { fill: #486581; font: 400 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .small { fill: #486581; font: 400 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
  </defs>

  <rect width="1740" height="1040" fill="url(#background)"/>
  <path d="M0 904 C310 828 580 980 900 902 S1450 830 1740 900 V1040 H0 Z" fill="#dfeaf7"/>
  <circle cx="1587" cy="108" r="141" fill="#d9e9f8"/>
  <circle cx="1680" cy="61" r="52" fill="#c4dbf2"/>

  <text x="90" y="88" class="eyebrow">COMPUTER SCIENCE GUIDE / A HUMAN MOTIVE</text>
  <text x="90" y="157" class="title">懒是人类进步的第一动力。</text>
  <text x="90" y="201" class="subtitle">不是不想做事，而是不想把时间浪费在可以交给工具的重复劳动上。</text>

  <g filter="url(#shadow)">
    <rect x="90" y="272" width="580" height="580" rx="30" fill="#ffffff"/>
    <rect x="770" y="272" width="880" height="580" rx="30" fill="#ffffff"/>
  </g>

  <text x="140" y="332" class="eyebrow">THE MOTIVE</text>
  <text x="140" y="387" class="heading">不想一直重复</text>
  <text x="140" y="424" class="body">同一个动作做一次是工作，</text>
  <text x="140" y="455" class="body">做一万次就该想办法改变它。</text>

  <g stroke="#3478c5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M158 707 H530"/>
    <path d="M184 707 L169 775 M504 707 L519 775"/>
    <circle cx="271" cy="535" r="43" fill="#e9f3ff"/>
    <path d="M210 665 C210 605 331 605 331 665 V707 H210 Z" fill="#e9f3ff"/>
    <path d="M331 631 C375 614 413 642 438 685" fill="none"/>
    <rect x="405" y="676" width="95" height="62" rx="7" fill="#fff9ec" stroke="#d99722"/>
  </g>
  <text x="452" y="715" text-anchor="middle" fill="#a3670c" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">重复题</text>
  <g fill="#d99722"><circle cx="420" cy="535" r="6"/><circle cx="454" cy="512" r="8"/><circle cx="490" cy="546" r="5"/></g>
  <text x="140" y="813" class="label">“懒”是对重复劳动的拒绝。</text>

  <text x="820" y="332" class="eyebrow">TURN THE WISH INTO TOOLS</text>
  <text x="820" y="387" class="heading">把重复交给工具</text>
  <text x="820" y="424" class="body">工具替人承担更多步骤，自动化由此不断向前。</text>

  <g transform="translate(830 500)">
    <rect width="190" height="200" rx="22" fill="#edf5fd" stroke="#9fc3e5" stroke-width="3"/>
    <text x="95" y="34" text-anchor="middle" class="eyebrow">TOOL 1</text>
    <path d="M39 70 H151 M39 100 H151 M39 130 H151 M50 55 V146 M140 55 V146" fill="none" stroke="#3478c5" stroke-width="5" stroke-linecap="round"/>
    <circle cx="72" cy="70" r="10" fill="#d99722"/><circle cx="104" cy="70" r="10" fill="#d99722"/>
    <circle cx="88" cy="100" r="10" fill="#d99722"/><circle cx="120" cy="130" r="10" fill="#d99722"/>
    <text x="95" y="180" text-anchor="middle" class="label">算盘</text>
  </g>
  <path d="M1043 600 H1081" fill="none" stroke="#3478c5" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g transform="translate(1100 500)">
    <rect width="190" height="200" rx="22" fill="#f4efff" stroke="#b9a4db" stroke-width="3"/>
    <text x="95" y="34" text-anchor="middle" fill="#70539c" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" letter-spacing="2">TOOL 2</text>
    <circle cx="76" cy="96" r="34" fill="none" stroke="#8d6ab8" stroke-width="10"/>
    <circle cx="123" cy="121" r="24" fill="none" stroke="#8d6ab8" stroke-width="9"/>
    <circle cx="76" cy="96" r="8" fill="#8d6ab8"/><circle cx="123" cy="121" r="6" fill="#8d6ab8"/>
    <text x="95" y="180" text-anchor="middle" class="label">机械装置</text>
  </g>
  <path d="M1313 600 H1351" fill="none" stroke="#3478c5" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g transform="translate(1370 500)">
    <rect width="190" height="200" rx="22" fill="#eaf7f1" stroke="#8dc7aa" stroke-width="3"/>
    <text x="95" y="34" text-anchor="middle" fill="#237250" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" letter-spacing="2">TOOL 3</text>
    <rect x="46" y="61" width="98" height="82" rx="16" fill="#ffffff" stroke="#329268" stroke-width="5"/>
    <path d="M33 84 H46 M33 120 H46 M144 84 H157 M144 120 H157 M74 48 V61 M116 48 V61 M74 143 V156 M116 143 V156" fill="none" stroke="#329268" stroke-width="5" stroke-linecap="round"/>
    <text x="95" y="113" text-anchor="middle" fill="#237250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700">RULE</text>
    <text x="95" y="180" text-anchor="middle" class="label">计算机</text>
  </g>
  <text x="820" y="766" class="label">人给出规则，工具反复执行。</text>
  <text x="820" y="800" class="body">这就是从“少做一点”走向自动化的过程。</text>

  <g transform="translate(90 910)">
    <rect width="1560" height="82" rx="22" fill="#ffffff" opacity="0.94"/>
    <circle cx="42" cy="41" r="12" fill="#8d6ab8"/>
    <text x="72" y="50" class="label">算盘、机械计算机和电子计算机，都是人类为了少做重复劳动而创造的工具。</text>
  </g>
</svg>
