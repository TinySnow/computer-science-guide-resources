<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1040" viewBox="0 0 1740 1040" role="img" aria-labelledby="title desc">
  <title id="title">为什么需要计算机？</title>
  <desc id="desc">大量重复计算让人耗时且容易出错。人给出计算规则，机器反复执行，计算机由此诞生。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#e9f1fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#17355d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#3478c5"/>
    </marker>
    <style>
      .title { fill: #102a43; font: 700 52px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .subtitle { fill: #627d98; font: 400 23px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .eyebrow { fill: #4776aa; font: 700 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 2px; }
      .heading { fill: #102a43; font: 700 30px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label { fill: #102a43; font: 700 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .body { fill: #486581; font: 400 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .formula { fill: #1f5e9f; font: 700 19px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .chip { fill: #1f5e9f; font: 700 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
  </defs>

  <rect width="1740" height="1040" fill="url(#background)"/>
  <path d="M0 904 C300 830 585 978 885 905 S1450 830 1740 900 V1040 H0 Z" fill="#dfeaf7"/>
  <circle cx="1590" cy="108" r="142" fill="#d9e9f8"/>
  <circle cx="1680" cy="58" r="54" fill="#c4dbf2"/>

  <text x="90" y="88" class="eyebrow">COMPUTER SCIENCE GUIDE / COMPUTER HISTORY</text>
  <text x="90" y="158" class="title">为什么需要计算机？</text>
  <text x="90" y="202" class="subtitle">当计算变得重复、庞大又容易出错，人类开始想：能不能把它交给机器？</text>

  <g filter="url(#shadow)">
    <rect x="90" y="272" width="730" height="600" rx="30" fill="#ffffff"/>
    <rect x="920" y="272" width="730" height="600" rx="30" fill="#ffffff"/>
  </g>

  <text x="140" y="332" class="eyebrow">01 / HUMAN WORK</text>
  <text x="140" y="387" class="heading">人亲手计算</text>
  <text x="140" y="424" class="body">每一道题都要按同样步骤重做一遍。</text>

  <g transform="translate(148 478)">
    <rect width="332" height="64" rx="16" fill="#edf5fd" stroke="#b7d2eb" stroke-width="2"/>
    <text x="28" y="41" class="formula">2x + 3 = 7</text>
    <text x="284" y="41" text-anchor="end" class="body">第 1 题</text>
    <rect y="82" width="332" height="64" rx="16" fill="#f4f8fc" stroke="#c9dbea" stroke-width="2"/>
    <text x="28" y="123" class="formula">2x + 3 = 7</text>
    <text x="284" y="123" text-anchor="end" class="body">第 2 题</text>
    <rect y="164" width="332" height="64" rx="16" fill="#f4f8fc" stroke="#c9dbea" stroke-width="2"/>
    <text x="28" y="205" class="formula">2x + 3 = 7</text>
    <text x="284" y="205" text-anchor="end" class="body">第 3 题</text>
  </g>
  <g transform="translate(575 510)">
    <circle cx="70" cy="70" r="62" fill="#fff9ec" stroke="#e9bc64" stroke-width="4"/>
    <path d="M70 34 V70 L99 90" fill="none" stroke="#d99722" stroke-width="8" stroke-linecap="round"/>
    <text x="70" y="164" text-anchor="middle" class="body">时间被占满</text>
  </g>
  <g transform="translate(548 708)">
    <rect width="192" height="54" rx="15" fill="#fff9ec" stroke="#e9bc64" stroke-width="2"/>
    <circle cx="28" cy="27" r="8" fill="#d99722"/>
    <text x="52" y="35" fill="#a3670c" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="700">重复很多次</text>
  </g>
  <text x="140" y="811" class="label">重复、耗时，也容易出错。</text>
  <text x="140" y="845" class="body">人一累，计算就会变慢；人一停，计算也随之停止。</text>

  <text x="970" y="332" class="eyebrow">02 / AUTOMATION</text>
  <text x="970" y="387" class="heading">把规则交给机器</text>
  <text x="970" y="424" class="body">人定义一次步骤，机器可以稳定地重复执行。</text>

  <g transform="translate(970 500)">
    <rect width="172" height="106" rx="20" fill="#edf5fd" stroke="#9fc3e5" stroke-width="3"/>
    <text x="86" y="45" text-anchor="middle" class="label">规则</text>
    <text x="86" y="78" text-anchor="middle" class="formula">2x + 3 = 7</text>
  </g>
  <path d="M1164 553 H1232" fill="none" stroke="#3478c5" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g transform="translate(1250 464)">
    <g stroke="#3478c5" stroke-width="5" stroke-linecap="round">
      <path d="M0 64 H36 M0 112 H36 M254 64 H290 M254 112 H290"/>
      <path d="M86 0 V34 M145 0 V34 M204 0 V34 M86 176 V210 M145 176 V210 M204 176 V210"/>
    </g>
    <rect x="36" y="34" width="218" height="142" rx="24" fill="#e9f3ff" stroke="#3478c5" stroke-width="5"/>
    <rect x="72" y="70" width="146" height="70" rx="14" fill="#ffffff" stroke="#9fc3e5" stroke-width="3"/>
    <text x="145" y="113" text-anchor="middle" class="chip">计算</text>
  </g>
  <path d="M1395 674 V691 H1440" fill="none" stroke="#3478c5" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g transform="translate(1455 650)">
    <rect width="145" height="82" rx="18" fill="#eaf7f1" stroke="#70b394" stroke-width="3"/>
    <text x="72" y="35" text-anchor="middle" fill="#237250" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700">结果</text>
    <text x="72" y="63" text-anchor="middle" fill="#237250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700">x = 2</text>
  </g>
  <text x="970" y="811" class="label">人给出一次规则；机器重复完成任务。</text>
  <text x="970" y="845" class="body">这就是把人从繁琐计算中解放出来的开始。</text>

  <g transform="translate(90 910)">
    <rect width="1560" height="82" rx="22" fill="#ffffff" opacity="0.94"/>
    <circle cx="42" cy="41" r="12" fill="#3478c5"/>
    <text x="72" y="50" class="label">计算机的起点，不是炫技，而是让机器代替人处理重复的计算。</text>
  </g>
</svg>
